[package]
name = "batch-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "batch_core"
path = "src/lib.rs"

[[bin]]
name = "batch"
path = "src/bin/batch.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
symphonia = { version = "=0.5.5", default-features = false, features = ["flac", "mp3", "wav"] }
