[package]
name = "bird-batch-gui"
version = "0.1.0"
description = "Bird Batch Runner"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
batch-core = { path = "../batch-core" }
serde_yaml = "0.9"
tokio = { version = "1.52.3", features = ["macros", "rt", "process", "io-util"] }

