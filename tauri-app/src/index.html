<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bird Audio (Tauri)</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="app">
      <h1>Bird Audio (Tauri)</h1>
      <div class="controls">
        <input id="filesInput" type="file" multiple accept="audio/*" />
        <button id="start">Start Processing</button>
      </div>
      <ul id="files"></ul>
      <div id="runs"></div>
      <h2>Logs</h2>
      <pre id="log"></pre>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
