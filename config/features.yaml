## Feature flags for Bird Audio
# Set flags to true/false to enable or disable features without code changes.

# When `parallel_control` is false, the user cannot change the number of
# parallel workers; the system will pick a safe default.
parallel_control: false

# Hide the entire advanced settings section when false.
advanced_settings: false

# Allow import UI (external commands)
import_enabled: false

# Card-based UI
card_ui: true

# Show time estimates (before a run, from your previous runs; during a run,
# from live throughput).
time_estimates: true

# Offer to continue an interrupted run when earlier results are found in the
# selected folder.
resume_runs: true

# Show guidance for analyzing recordings stored in OneDrive.
cloud_import: false

# Make the cache's housekeeping visible: a "Clear cache" button that names the
# files it removed (including the WAL sidecars), and a notice at the start of a
# run when recordings that vanished from disk were dropped from the plan.
cache_transparency: true

# Per-recording retry (↻) on failed rows in the run's file list, alongside the
# whole-session "Retry failed" button.
row_retry: true
